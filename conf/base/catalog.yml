# Sprint 2 — szablon katalogu danych Kedro.
# TODO (zespół): zdefiniuj wejścia/wyjścia w formacie Kedro Data Catalog,
# np. raw_data, dane po przetworzeniu, model i metryki.
# Użyj nazw klas zakończonych na Dataset, zgodnie z wersją Kedro.
raw_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/secondary_mushrooms/secondary_data.csv
  load_args:
    sep: ";"

model_input:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/mushrooms.csv
  save_args:
    index: false

trained_model:
  type: pickle.PickleDataset
  filepath: data/06_models/mushroom_model.pkl

baseline_model:
  type: pickle.PickleDataset
  filepath: data/06_models/baseline_model.pkl

model_metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/model_metrics.json

baseline_metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/baseline_metrics.json
