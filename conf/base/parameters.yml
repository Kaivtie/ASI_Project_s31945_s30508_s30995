# Sprint 2 — parametry pipeline'u.
# TODO (zespół): dodaj test_size, random_state i inne parametry zgodne
# z project.yaml oraz kontraktem wybranego datasetu.
test_size: 0.2
random_state: 42

numeric_features:
  - cap-diameter
  - stem-height
  - stem-width

categorical_features:
  - cap-shape
  - cap-surface
  - cap-color
  - does-bruise-or-bleed
  - gill-attachment
  - gill-spacing
  - gill-color
  - stem-root
  - stem-surface
  - stem-color
  - veil-type
  - veil-color
  - has-ring
  - ring-type
  - spore-print-color
  - habitat
  - season
